services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    env_file:
      - ./backend/project1b-smart-room-monitor-fastapi/.env.prod
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

  backend:
    image: ghcr.io/gonzalezsanchez/iot-backend:latest
    env_file:
      - ./backend/project1b-smart-room-monitor-fastapi/.env.prod
    depends_on:
      - otel-collector
    restart: unless-stopped
    expose:
      - "8000"

  ai-assistant:
    image: ghcr.io/gonzalezsanchez/iot-ai-assistant:latest
    env_file:
      - ./backend/project4-ai-assistant/.env.prod
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "8001"

  frontend:
    image: ghcr.io/gonzalezsanchez/iot-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-assistant
    restart: unless-stopped

  # Project 3b — device gateway. Redpanda and the gateway are internal-only:
  # devices are simulated in-network (docs/project3-prd.md §2, §8).
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    expose:
      - "9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  gateway:
    image: ghcr.io/gonzalezsanchez/iot-gateway:latest
    env_file:
      - ./backend/project3b-iot-gateway/.env.prod
    depends_on:
      - redpanda
    expose:
      - "8002"
    restart: unless-stopped

  # Same image as the gateway, different entrypoint — normalises topic messages
  # to the shared contract tables. Own env file: separate least-privilege AWS user.
  consumer:
    image: ghcr.io/gonzalezsanchez/iot-gateway:latest
    command: ["python", "-m", "consumer.main"]
    env_file:
      - ./backend/project3b-iot-gateway/.env.consumer.prod
    depends_on:
      - redpanda
    restart: unless-stopped

volumes:
  redpanda_data:

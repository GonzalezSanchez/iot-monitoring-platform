version: '3.8'

services:
  backend:
    build:
      context: ./backend/project1b-smart-room-monitor-fastapi
    env_file:
      - ./backend/project1b-smart-room-monitor-fastapi/.env.prod
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

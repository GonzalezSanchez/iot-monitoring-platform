server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container
    location ~ ^/(rooms|events|health|docs|openapi.json|lakehouse) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI assistant (project 4b) — SSE, so buffering must stay off
    location /ai/ {
        proxy_pass http://ai-assistant:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    # React SPA — all other routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-project1:
    name: project1 lambda tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project1a-smart-room-monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/ -v

  test-project1b:
    name: project1b tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project1b-smart-room-monitor-fastapi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  test-project2a:
    name: project2a tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2a-behavior-analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check lambdas/ tests/

      - name: Run mypy
        run: mypy lambdas/ --ignore-missing-imports

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --cov=lambdas --cov-report=term-missing --cov-fail-under=80

  terraform-project2a:
    name: project2a terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2a-behavior-analyzer/infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  test-project2b-jobs:
    name: project2b PySpark tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2b-behavior-analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyspark psycopg2-binary python-dotenv boto3 pytest pytest-cov ruff mypy pandas geopandas shapely opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Run ruff
        run: ruff check jobs/ scripts/ tests/unit/ --exclude tests/unit/test_dag.py

      - name: Run mypy
        run: mypy jobs/ scripts/ --ignore-missing-imports

      - name: Run PySpark + migrate tests
        run: pytest tests/unit/ --ignore=tests/unit/test_dag.py -v --cov=jobs --cov=scripts --cov-report=term-missing --cov-fail-under=80

  test-project2b-dag:
    name: project2b Airflow DAG tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2b-behavior-analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "apache-airflow>=2.9.0,<3.0.0" pytest ruff
        env:
          AIRFLOW_HOME: /tmp/airflow

      - name: Run ruff on dags
        run: ruff check dags/

      - name: Run DAG tests
        run: pytest tests/unit/test_dag.py -v
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  test-project2b-dbt:
    name: project2b dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2b-behavior-analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-postgres>=1.7.0,<2.0.0" "dbt-core>=1.7.0,<1.12.0"

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt

  terraform-project2b:
    name: project2b terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2b-behavior-analyzer/infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  test-project2c:
    name: project2c tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2c-lakehouse-dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check scripts/ jobs/ tests/

      - name: Run mypy
        run: mypy scripts/ jobs/ tests/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/unit/ -v --cov=scripts --cov=jobs --cov-report=term-missing --cov-fail-under=80

  test-project2c-dbt:
    name: project2c dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2c-lakehouse-dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-databricks
        run: pip install "dbt-databricks==1.9.5" "dbt-core==1.9.4"

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt

  terraform-project2c:
    name: project2c terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2c-lakehouse-dbt/infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

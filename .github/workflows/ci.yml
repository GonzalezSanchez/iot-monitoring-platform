name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-project1:
    name: project1 lambda tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project1a-smart-room-monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/ -v

  test-project1b:
    name: project1b tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project1b-smart-room-monitor-fastapi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  test-project2a:
    name: project2a tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2a-behavior-analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check lambdas/ tests/

      - name: Run mypy
        run: mypy lambdas/ --ignore-missing-imports

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --cov=lambdas --cov-report=term-missing --cov-fail-under=80

  terraform-project2a:
    name: project2a terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/project2a-behavior-analyzer/infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

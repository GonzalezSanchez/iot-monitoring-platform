name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/project1b-smart-room-monitor-fastapi/**'
      - 'backend/project4-ai-assistant/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/project1b-smart-room-monitor-fastapi
          push: true
          tags: ghcr.io/gonzalezsanchez/iot-backend:latest

      - name: Build and push AI assistant image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/project4-ai-assistant
          push: true
          tags: ghcr.io/gonzalezsanchez/iot-ai-assistant:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/gonzalezsanchez/iot-frontend:latest
          build-args: |
            VITE_API_ENDPOINT=${{ secrets.VITE_API_ENDPOINT }}
            VITE_P2A_API_ENDPOINT=${{ secrets.VITE_P2A_API_ENDPOINT }}
            VITE_AI_ENDPOINT=${{ secrets.VITE_AI_ENDPOINT }}

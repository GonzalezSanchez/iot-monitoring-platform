version: 2

sources:
  - name: silver
    catalog: p2c_dev
    schema: silver
    description: "Validated sensor events — output van de PySpark WAP pipeline"
    tables:
      - name: sensor_events
        description: "Getypeerde, ontdubbelde sensor events. Alleen goedgekeurde records."
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: _ingestion_time
        columns:
          - name: event_id
            description: "UUID — unieke sleutel per sensor event"
            data_tests:
              - unique
              - not_null
          - name: room_id
            description: "Kamer-ID (bijv. room_001) — foreign key naar dim_rooms"
            data_tests:
              - not_null
          - name: sensor_type
            description: "Type sensor: temperature (°C), co2 (ppm), occupancy (bool), humidity (%)"
            data_tests:
              - not_null
              - accepted_values:
                  values: [temperature, co2, occupancy, humidity]
          - name: value
            description: "Gemeten waarde — eenheid afhankelijk van sensor_type"
            data_tests:
              - not_null
          - name: ts
            description: "Tijdstip van de meting (UTC)"
            data_tests:
              - not_null
          - name: _source_file
            description: "Pad van het bronbestand in ADLS Bronze (lineage)"
          - name: _ingestion_time
            description: "Tijdstip waarop het record de Silver laag binnenkwam (UTC)"

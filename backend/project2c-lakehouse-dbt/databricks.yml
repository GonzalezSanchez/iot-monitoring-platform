bundle:
  name: p2c-iot-pipeline

variables:
  catalog:
    default: p2c_dev
  storage_account:
    default: stp2cdeviotags
  storage_container_bronze:
    default: bronze
  # No defaults for these two — not secrets, but real identifiers (a SQL warehouse ID,
  # an email address) that don't belong hardcoded in a public repo either. Supplied via
  # BUNDLE_VAR_warehouse_id / BUNDLE_VAR_notification_email (CI: repo variables, not
  # secrets; locally: your shell env).
  warehouse_id:
    description: "SQL warehouse ID for the dbt task — no default, see note above"
  notification_email:
    description: "Address for job-failure notifications — no default, see note above"

targets:
  dev:
    default: true
    # No workspace.host here on purpose — Databricks hosts can't be bundle variables,
    # and this repo is public. The CLI resolves the host from DATABRICKS_HOST (CI secret)
    # or the caller's local profile instead, so no workspace URL is ever committed.
    variables:
      catalog: p2c_dev
  prod:
    variables:
      catalog: p2c_prod

resources:
  jobs:
    iot_pipeline:
      name: "[${bundle.target}] iot-pipeline"

      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"
        timezone_id: "Europe/Brussels"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - ${var.notification_email}

      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            # Single-node cluster (driver only) — voldoende voor 1000 records, goedkoopste optie
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            # SINGLE_USER: vereist voor Auto Loader streaming + Unity Catalog
            data_security_mode: SINGLE_USER
            spark_env_vars:
              AZURE_STORAGE_ACCOUNT_NAME: ${var.storage_account}
              AZURE_STORAGE_CONTAINER_BRONZE: ${var.storage_container_bronze}
              DATABRICKS_CATALOG: ${var.catalog}

      tasks:
        - task_key: bronze_autoloader
          description: "Auto Loader: ADLS Bronze JSON → Delta bronze.sensor_events"
          job_cluster_key: main
          # Transient failures (cluster not up yet, a throttled ADLS call) shouldn't need a
          # human — retry before the email_notifications.on_failure above ever fires.
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ./jobs/bronze_autoloader.py
          libraries:
            - pypi:
                package: python-dotenv==1.2.2

        - task_key: silver_wap
          description: "WAP: bronze.sensor_events → silver.sensor_events + quarantine"
          depends_on:
            - task_key: bronze_autoloader
          job_cluster_key: main
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ./jobs/silver_wap.py
          libraries:
            - pypi:
                package: python-dotenv==1.2.2

        - task_key: dbt_gold
          description: "dbt build: silver.sensor_events → gold marts"
          depends_on:
            - task_key: silver_wap
          job_cluster_key: main
          max_retries: 2
          min_retry_interval_millis: 300000
          dbt_task:
            project_directory: ./dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: gold
            commands:
              - "dbt build"
          libraries:
            - pypi:
                package: dbt-databricks==1.9.5
            - pypi:
                package: dbt-core==1.9.4

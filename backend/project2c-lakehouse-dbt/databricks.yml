bundle:
  name: p2c-iot-pipeline

variables:
  catalog:
    default: p2c_dev
  storage_account:
    default: stp2cdeviotags
  storage_container_bronze:
    default: bronze

targets:
  dev:
    default: true
    # No workspace.host here on purpose — Databricks hosts can't be bundle variables,
    # and this repo is public. The CLI resolves the host from DATABRICKS_HOST (CI secret)
    # or the caller's local profile instead, so no workspace URL is ever committed.
    variables:
      catalog: p2c_dev
  prod:
    variables:
      catalog: p2c_prod

resources:
  jobs:
    iot_pipeline:
      name: "[${bundle.target}] iot-pipeline"

      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"
        timezone_id: "Europe/Brussels"
        pause_status: PAUSED

      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            # Single-node cluster (driver only) — voldoende voor 1000 records, goedkoopste optie
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            # SINGLE_USER: vereist voor Auto Loader streaming + Unity Catalog
            data_security_mode: SINGLE_USER
            spark_env_vars:
              AZURE_STORAGE_ACCOUNT_NAME: ${var.storage_account}
              AZURE_STORAGE_CONTAINER_BRONZE: ${var.storage_container_bronze}
              DATABRICKS_CATALOG: ${var.catalog}

      tasks:
        - task_key: bronze_autoloader
          description: "Auto Loader: ADLS Bronze JSON → Delta bronze.sensor_events"
          job_cluster_key: main
          spark_python_task:
            python_file: ./jobs/bronze_autoloader.py
          libraries:
            - pypi:
                package: python-dotenv==1.2.2

        - task_key: silver_wap
          description: "WAP: bronze.sensor_events → silver.sensor_events + quarantine"
          depends_on:
            - task_key: bronze_autoloader
          job_cluster_key: main
          spark_python_task:
            python_file: ./jobs/silver_wap.py
          libraries:
            - pypi:
                package: python-dotenv==1.2.2

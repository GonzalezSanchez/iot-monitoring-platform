[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = lambdas
addopts = --cov=lambdas --cov-report=term-missing --cov-fail-under=80
markers =
    integration: tests that require a running PostgreSQL (docker compose up)
    regression: guard against specific bugs found during development (require PostgreSQL)

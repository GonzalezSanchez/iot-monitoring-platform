AWSTemplateFormatVersion: "2010-09-09"
Description: "Project 2a - Behavior Analyzer - Aurora Serverless v2 (auto-pause enabled)"

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  DBName:
    Type: String
    Default: p2a_prod

  DBUsername:
    Type: String
    Default: p2a_admin
    NoEcho: true
Conditions:
  IsProd: !Equals [!Ref Environment, prod]
Resources:
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "p2a-${Environment}-aurora"
      Engine: aurora-postgresql
      EngineVersion: "15.4"
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUsername
      # Password managed via Secrets Manager rotation — not set here
      ManageMasterUserPassword: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2
      # Auto-pause: cluster scales to zero after 5 minutes of inactivity
      # Cold start on wake-up: ~5 seconds (acceptable for scheduled batch pipeline)
      EnableHttpEndpoint: false
      StorageEncrypted: true
      DeletionProtection: !If [IsProd, true, false]
      DBSubnetGroupName: !ImportValue
        Fn::Sub: "p2a-${Environment}-DBSubnetGroupName"
      VpcSecurityGroupIds:
        - !ImportValue
          Fn::Sub: "p2a-${Environment}-AuroraSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "p2a-${Environment}-aurora"
        - Key: Project
          Value: p2a-behavior-analyzer

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "p2a-${Environment}-aurora-instance"
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "p2a-${Environment}-aurora-instance"

Outputs:
  AuroraClusterEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub "p2a-${Environment}-AuroraEndpoint"

  AuroraClusterPort:
    Value: !GetAtt AuroraCluster.Endpoint.Port
    Export:
      Name: !Sub "p2a-${Environment}-AuroraPort"

  AuroraClusterId:
    Value: !Ref AuroraCluster
    Export:
      Name: !Sub "p2a-${Environment}-AuroraClusterId"

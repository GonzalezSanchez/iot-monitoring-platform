AWSTemplateFormatVersion: "2010-09-09"
Description: "Project 2a - Behavior Analyzer - Secrets Manager"

# NOTE: Aurora DB credentials are managed automatically by the database.yml stack
# via ManageMasterUserPassword: true. That secret is named by AWS.
#
# This template creates an additional secret that Lambda functions use to connect —
# containing the endpoint, port, dbname, and a reference to the master credentials.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Resources:
  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "p2a-${Environment}-db-credentials"
      Description: "Aurora PostgreSQL connection details for project 2a ETL lambdas"
      SecretString: !Sub |
        {
          "host": "REPLACE_WITH_AURORA_ENDPOINT",
          "port": 5432,
          "dbname": "p2a_prod",
          "username": "p2a_admin",
          "password": "REPLACE_AFTER_DEPLOY"
        }
      Tags:
        - Key: Project
          Value: p2a-behavior-analyzer
        - Key: Environment
          Value: !Ref Environment

  # NOTE: After deploying database.yml, update this secret with the actual endpoint:
  # aws secretsmanager update-secret \
  #   --secret-id p2a-prod-db-credentials \
  #   --secret-string '{"host":"<aurora-endpoint>","port":5432,"dbname":"p2a_prod","username":"p2admin","password":"<password>"}'

Outputs:
  DBCredentialsSecretArn:
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub "p2a-${Environment}-DBCredentialsSecretArn"

  DBCredentialsSecretName:
    Value: !Sub "p2a-${Environment}-db-credentials"
    Export:
      Name: !Sub "p2a-${Environment}-DBCredentialsSecretName"

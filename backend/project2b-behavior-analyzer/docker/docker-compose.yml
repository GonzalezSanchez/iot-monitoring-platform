services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: p2b_admin
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: p2b_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  airflow:
    image: apache/airflow:2.9.0-python3.11
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://p2b_admin:dev@postgres/p2b_dev
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../jobs:/opt/airflow/jobs
      - airflow_logs:/opt/airflow/logs
    command: standalone

volumes:
  postgres_data:
  minio_data:
  airflow_logs:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
    environment:
      # Airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Java / Spark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_MASTER: local[2]
      # PostgreSQL — DB_HOST overridden: inside Docker the service name is 'postgres'
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # AWS
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-prod-SensorEvents}
      S3_PARQUET_PATH: ${S3_PARQUET_PATH}
      S3_PROCESSED_PATH: ${S3_PROCESSED_PATH}
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../jobs:/opt/airflow/jobs
      - ../scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
      - spark_jars:/home/airflow/.ivy2
    command: standalone

volumes:
  postgres_data:
  airflow_logs:
  spark_jars:

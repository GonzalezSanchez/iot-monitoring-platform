services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      - postgres
    expose:
      - "9187"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - postgres-exporter
    expose:
      - "4317"
      - "4318"
      - "8125"

  airflow:
    restart: unless-stopped
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - otel-collector
    environment:
      # Airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Airflow StatsD → OTel Collector
      AIRFLOW__METRICS__STATSD_ON: "True"
      AIRFLOW__METRICS__STATSD_HOST: otel-collector
      AIRFLOW__METRICS__STATSD_PORT: "8125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      # Java / Spark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_MASTER: local[2]
      # PostgreSQL — DB_HOST overridden: inside Docker the service name is 'postgres'
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # AWS
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-prod-SensorEvents}
      S3_PARQUET_PATH: ${S3_PARQUET_PATH}
      S3_PROCESSED_PATH: ${S3_PROCESSED_PATH}
      # OTel — custom job metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../jobs:/opt/airflow/jobs
      - ../scripts:/opt/airflow/scripts
      - ../dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - spark_jars:/home/airflow/.ivy2
    command: standalone

volumes:
  postgres_data:
  airflow_logs:
  spark_jars:

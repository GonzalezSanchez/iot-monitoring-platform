receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  statsd:
    endpoint: 0.0.0.0:8125
    aggregation_interval: 60s

  prometheus:
    config:
      scrape_configs:
        - job_name: postgres
          scrape_interval: 30s
          static_configs:
            - targets: ["postgres-exporter:9187"]

processors:
  batch:
    timeout: 10s

  # Grafana Cloud's OTLP endpoint rejects these scheduler-internal StatsD
  # metrics ("invalid temporality and type combination") and then drops the
  # ENTIRE batch they arrive in. None of them feed our dashboards — drop them
  # before export so the rest of the batch survives.
  filter/grafana_incompatible:
    metrics:
      metric:
        - 'name == "airflow.scheduler_heartbeat"'
        - 'name == "airflow.triggerer_heartbeat"'
        - 'name == "airflow.dag_processing.processes"'
        - 'name == "airflow.dag_processing.file_path_queue_update_count"'
        - 'IsMatch(name, "airflow\\.scheduler\\.orphaned_tasks\\..*")'

exporters:
  otlphttp:
    endpoint: ${GRAFANA_OTLP_ENDPOINT}
    headers:
      authorization: Basic ${GRAFANA_OTLP_TOKEN}

service:
  pipelines:
    metrics:
      receivers: [otlp, statsd, prometheus]
      processors: [filter/grafana_incompatible, batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]

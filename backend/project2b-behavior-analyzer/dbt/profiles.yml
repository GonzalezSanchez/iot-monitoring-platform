behavior_analyzer:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'p2b_dev') }}"
      user: "{{ env_var('DB_USER', 'p2b_admin') }}"
      password: "{{ env_var('DB_PASSWORD', 'dev') }}"
      schema: public
      threads: 2

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IoT Monitoring Platform (Project 1 — Lambda) — IAM user for GitHub Actions CI/CD.
  Grants least-privilege permissions to deploy Lambda functions and CloudFormation stacks.

Resources:

  GitHubActionsUser:
    Type: AWS::IAM::User
    DeletionPolicy: Retain
    Properties:
      UserName: iot-monitoring-github-actions
      Tags:
        - Key: Project
          Value: iot-monitoring-platform
        - Key: Purpose
          Value: github-actions-cicd

  # Managed policy instead of inline: inline policies on a user are capped at
  # 2048 characters combined, a managed policy allows 6144. Own logical ID —
  # CloudFormation does not allow changing the type of an existing resource.
  GitHubActionsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    Properties:
      ManagedPolicyName: iot-monitoring-github-actions-policy
      Users:
        - !Ref GitHubActionsUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:ValidateTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
            Resource: "arn:aws:cloudformation:eu-central-1:*:stack/smart-room-monitor-*"

          - Sid: CloudFormationTemplateSummary
            Effect: Allow
            Action:
              - cloudformation:GetTemplateSummary
            Resource: "*"

          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:ListFunctions
            Resource: "arn:aws:lambda:eu-central-1:*:function:*-IngestEvent"

          - Sid: LambdaOtherFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:AddPermission
              - lambda:RemovePermission
            Resource:
              - "arn:aws:lambda:eu-central-1:*:function:*-GetRooms"
              - "arn:aws:lambda:eu-central-1:*:function:*-GetRoomDetail"

          - Sid: IAMForLambdaRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRole
              - iam:PassRole
            Resource: "arn:aws:iam::*:role/*-SmartRoomMonitor-*"

          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
            Resource: "arn:aws:dynamodb:eu-central-1:*:table/*-smart-room-*"

          - Sid: APIGateway
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:GET
              - apigateway:DELETE
            Resource: "arn:aws:apigateway:eu-central-1::*"

          # --- Project 3b (device gateway) — deploy-project3-infra.yml -------

          - Sid: CloudFormationProject3
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:ValidateTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
            Resource: "arn:aws:cloudformation:eu-central-1:*:stack/iot-gateway-*"

          - Sid: DynamoDBProject3
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
            Resource: "arn:aws:dynamodb:eu-central-1:*:table/p3-*-Devices"

          - Sid: IAMForGatewayUser
            Effect: Allow
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:GetUser
              - iam:TagUser
              - iam:UntagUser
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:GetUserPolicy
              # CloudFormation's user handler needs this in the delete/rollback flow
              - iam:ListAccessKeys
            Resource:
              - "arn:aws:iam::*:user/iot-gateway-app"
              - "arn:aws:iam::*:user/iot-gateway-consumer"

Outputs:
  GitHubActionsUserArn:
    Description: IAM user ARN for GitHub Actions — create access key manually after deployment
    Value: !GetAtt GitHubActionsUser.Arn

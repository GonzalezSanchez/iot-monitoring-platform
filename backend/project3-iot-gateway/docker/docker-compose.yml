# Local development — Redpanda + gateway.
# Run from this directory: docker compose up -d
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    build: ..
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8002:8002"
    depends_on:
      redpanda:
        condition: service_healthy
